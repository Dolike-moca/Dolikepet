[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.moc3,*.json,native/BowlFiles.exe,native/DesktopShell.exe,assets/app/*.ico,licenses/*"
exclude_filter="tests/*,tools/*,build/*,README.md,dependency-lock.json,*.md"
export_path="../Runtime/DolikePet.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="../../_tools/runtime/godot-build/export-templates/windows_debug_x86_64.exe"
custom_template/release="../../_tools/runtime/godot-build/export-templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
application/product_name="Dolike Desktop Pet"
application/file_version="0.2.0.0"
application/product_version="0.2.0.0"
application/file_description="Live2D desktop pet powered by Godot"
application/icon="res://assets/app/icon.ico"
